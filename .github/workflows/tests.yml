name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.8 is the minimum supported version; newer runner images no longer ship it.
          - os: ubuntu-22.04
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Syntax check
        run: python -m py_compile orbit_and_launch_alert.py
      - name: Run tests (offline)
        run: python -m pytest -q
      - name: Demo mode smoke test
        run: OLA_MODE=demo python orbit_and_launch_alert.py
